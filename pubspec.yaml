name: client_app_design_system
description: A new Flutter package project.
version: 0.0.1
homepage: "https://github.com/"

environment:
  sdk: ">=2.18.2 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  doc_widget: ^0.4.0
  flutter:
    sdk: flutter
  google_fonts: 4.0.3
  mix: 0.0.6
  get: 4.6.5
  heroicons: 0.7.0
  unicons: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  doc_widget_builder: ^0.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  fonts:
    - family: jakarta
      fonts:
        - asset: assets/fonts/plus-Jakarta-Sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus-Jakarta-Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus-Jakarta-Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus-Jakarta-Sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus-Jakarta-Sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
